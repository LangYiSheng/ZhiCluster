services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/app
  worker:
    command: ["watchfiles", "--filter", "python", "python -m app.worker.main", "/app/app"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/app:/app/app
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    ports: !override
      - "127.0.0.1:3000:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
