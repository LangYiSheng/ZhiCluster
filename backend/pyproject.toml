[project]
name = "zhicluster"
version = "0.1.0"
description = "Local-first AI knowledge workspace"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.39,<3", "alembic>=1.15,<2", "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.4,<1", "python-multipart>=0.0.20", "httpx>=0.28,<1",
  "pymupdf>=1.25,<2", "python-docx>=1.1,<2", "charset-normalizer>=3.4,<4",
  "tiktoken>=0.9,<1", "langchain>=1.0,<2", "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3.0,<4",
  "cryptography>=46,<48",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "watchfiles>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
