name: zhicluster
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://zhicluster:local_password@db:5432/zhicluster
    UPLOAD_ROOT: /data/uploads
    APP_ENV: local
  volumes:
    - uploads:/data/uploads
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: zhicluster
      POSTGRES_USER: zhicluster
      POSTGRES_PASSWORD: local_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhicluster -d zhicluster"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed && python -m app.agent.graph --setup"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker.main"]
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:
  uploads:
